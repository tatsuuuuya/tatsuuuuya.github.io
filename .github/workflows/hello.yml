name: Hello
on: [push]
jobs:
    hello:
        runs-on: ubuntu-latest
        steps:
            - run: echo "Hello, World"
            - uses: actions/checkout@v4
    # secretを引用する
    use-secret:
        runs-on: ubuntu-latest
        steps:
          - name: Use secret
            run: echo "secret is ${{ secrets.MY_SECRET }}"
            env:
              TOKEN: ${{ secrets.MY_SECRET }}
