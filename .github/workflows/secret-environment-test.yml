name: Secret Environment Test
on: [push]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging'}} # ref_nameはbranch名かtags名を取得する
    steps:
      - name: Deploy to environment # actions以外のカスタムのstepは、nameを名付けることが多そう
        run: echo "deploying to ${{ vars.DEPLOY_TARGET }}" # staging or productuion環境のどちらが良いか

      - name: Notify only on production
        if: github.ref_name == 'main'
        run: echo "🚀本番環境にデプロイしました！通知を送ります"

      - name: Debug info for staging only
        if: github.ref_name != 'main'
        run: echo "🧪staging環境です。デバッグ情報を出力します"